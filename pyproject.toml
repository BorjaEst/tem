[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-tem"
version = "0.1.0"
description = "PyTorch package for Tolman-Eichenbaum Machine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Borja Esteban", email = "boressan@outlook.com" },
    { name = "Jacob Bakermans", email = "jacob.bakermans@gmail.com" },
]
keywords = ["machine learning", "neuroscience", "spatial cognition", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch~=2.9.0",
    "lightning~=2.6.0",
    "torchvision~=0.24.0",
    "pydantic~=2.12.0",
    "pydantic_settings~=2.11.0",
    "rich~=14.2.0",
    "scipy~=1.16.0",
    "matplotlib~=3.10.0",
    "tensorboard~=2.20.0",
    "networkx~=3.5.0",
    "SciencePlots~=2.2.0",
    "pub-ready-plots~=1.2.3",
]

[project.optional-dependencies]
dev = ["pytest~=8.4.0", "black~=25.9.0", "flake8~=7.3.0", "mypy~=1.18.0"]

[project.urls]
Homepage = "https://github.com/BorjaEst/torch-tem"
Repository = "https://github.com/BorjaEst/torch.tem"
Documentation = "https://github.com/BorjaEst/torch-tem/blob/main/README.md"

[tool.setuptools]
packages = ["torch_tem"]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
torch_tem = ["py.typed"]

[tool.isort]
profile = "black"
line_length = 180
known_first_party = ["torch_tem"]

[tool.black]
line-length = 180
target-version = ["py312"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
